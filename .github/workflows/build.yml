name: Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore "Linkpi Monitor.slnx" --runtime win-x64

      - name: Test
        run: dotnet test "Linkpi Monitor.slnx" --configuration Release --no-restore

      - name: Collect core coverage
        run: dotnet test "Linkpi Monitor.slnx" --configuration Debug --no-restore --coverlet --results-directory TestResults-Coverage

      - name: Verify core coverage
        shell: pwsh
        run: ./.github/scripts/Verify-Coverage.ps1 -ResultsDirectory TestResults-Coverage
