name: Lock

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: lock-${{ github.repository }}

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: dessant/lock-threads@v6
        with:
          github-token: ${{ github.token }}
          exclude-any-issue-labels: 'planned,help wanted'
          issue-inactive-days: "30"
          issue-lock-reason: ""
          process-only: issues
